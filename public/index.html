<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSCC Chatbot Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: white;
        }
        /* Floating Button */
        .chat-float-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #1e6b2f;
            border: none;
            box-shadow: 0 8px 24px rgba(45, 138, 62, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .chat-float-btn svg {
            width: 32px;
            height: 32px;
            stroke: white;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .chat-float-btn.hidden {
            display: none;
        }

        /* Chat Window */
        .chat-window {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 420px;
            height: 600px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .chat-window.open {
            display: flex;
        }

        /* Header */
        .chat-header {
            background: #1e6b2f;
            padding: 20px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-text h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .chat-header-text p {
            margin: 0;
            font-size: 13px;
            opacity: 0.9;
        }

        .chat-close-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .chat-close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .chat-close-btn svg {
            width: 24px;
            height: 24px;
            stroke: white;
            fill: none;
            stroke-width: 2;
        }

        /* Body */
        .chat-body {
            flex: 1;
            overflow: auto;
            background: #f8f9fa;
        }

        /* Language Selection */
        .language-selection {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        .language-selection.hidden {
            display: none;
        }

        .language-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e8b923;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .language-icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
            fill: none;
            stroke-width: 2;
        }

        .language-selection h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #2d3748;
            text-align: center;
        }

        .language-selection p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 32px;
            text-align: center;
        }

        .language-buttons {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 320px;
        }

        .language-btn {
            flex: 1;
            padding: 12px 20px;
            background: #2d8a3e;
            border: none;
            border-radius: 100px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .language-btn:hover {
            background: #22702f;
        }

        /* Chat Messages */
        .chat-messages {
            display: none;
        }

        .chat-messages.active {
            display: block;
        }

        .language-toggle {
            position: absolute;
            width: 100%;
            padding: 10px 16px;
            background: #e8f5e9;
            border-bottom: 1px solid #c8e6c9;
        }

        .toggle-btn {
            background: white;
            border: 1px solid #2d8a3e;
            border-radius: 8px;
            padding: 8px 16px;
            color: #2d8a3e;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .toggle-btn:hover {
            background: #2d8a3e;
            color: white;
        }

        .toggle-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .messages-container {
            padding: 20px;
            min-height: 300px;
        }

        .message {
            display: flex;
            margin-bottom: 16px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message.bot .message-bubble {
            border-radius: 16px 16px 16px 4px;
            background: white;
            color: #2d3748;
            padding: 16px;
        }

        .message.user .message-bubble {
            border-radius: 16px 16px 4px 16px;
            background:  #1e6b2f;
            color: white;
        }

        .typing-indicator {
            display: none;
            justify-content: flex-start;
            margin-bottom: 16px;
            padding: 10px 20px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-bubble {
            color: #64748b;
            font-size: 12px;
            font-style: italic;
        }

        /* Input Area */
        .chat-input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: none;
        }

        .chat-input-area.active {
            display: block;
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #2d8a3e;
        }

        .send-btn {
            padding: 12px;
            background: #e2e8f0;
            border: none;
            border-radius: 12px;
            cursor: not-allowed;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            width: 44px;
            height: 44px;
        }

        .send-btn.active {
            background: linear-gradient(135deg, #2d8a3e 0%, #1e6b2f 100%);
            cursor: pointer;
        }

        .send-btn.active:hover {
            transform: scale(1.05);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            stroke: #94a3b8;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .send-btn.active svg {
            stroke: white;
        }

        @media (max-width: 480px) {
            .chat-window {
                width: calc(100% - 32px);
                height: calc(100% - 32px);
                bottom: 16px;
                right: 16px;
            }
        }

        .message-bubble ul {
            margin: 8px 0;
            padding-left: 20px;
        }
        
        .message-bubble li {
            margin: 4px 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>
<!-- Floating Button -->
<button class="chat-float-btn" id="chatFloatBtn">
    <svg viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
</button>

<!-- Chat Window -->
<div class="chat-window" id="chatWindow">
    <!-- Header -->
    <div class="chat-header">
        <div class="chat-header-left">
            <div class="chat-header-text">
                <h3>GSCC Assistant</h3>
                <p id="headerStatus">Ready</p>
            </div>
        </div>
        <button class="chat-close-btn" id="chatCloseBtn">
            <svg viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <!-- Body -->
    <div class="chat-body">
        <!-- Language Selection -->
        <div class="language-selection" id="languageSelection">
            <div class="language-icon">
                <svg viewBox="0 0 24 24">
                    <path d="m5 8 6 6"></path>
                    <path d="m4 14 6-6 2-3"></path>
                    <path d="M2 5h12"></path>
                    <path d="M7 2h1"></path>
                    <path d="m22 22-5-10-5 10"></path>
                    <path d="M14 18h6"></path>
                </svg>
            </div>
            <h3>Select Your Language / भाषा चुनें</h3>
            <p>Choose your preferred language to continue<br/><br/>जारी रखने के लिए अपनी पसंदीदा भाषा चुनें</p>
            <div class="language-buttons">
                <button class="language-btn" onclick="selectLanguage('english')">English</button>
                <button class="language-btn hindi" onclick="selectLanguage('hindi')">हिंदी</button>
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="language-toggle">
                <button class="toggle-btn" onclick="changeLanguage()">
                    <svg viewBox="0 0 24 24">
                        <path d="m5 8 6 6"></path>
                        <path d="m4 14 6-6 2-3"></path>
                        <path d="M2 5h12"></path>
                        <path d="M7 2h1"></path>
                        <path d="m22 22-5-10-5 10"></path>
                        <path d="M14 18h6"></path>
                    </svg>
                    <span id="toggleBtnText">Change Language</span>
                </button>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-bubble">
                    <span id="typingText"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area" id="chatInputArea">
        <div class="input-container">
            <input
                    type="text"
                    class="chat-input"
                    id="chatInput"
                    placeholder="Ask about GSCC scheme..."
            >
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    // API Configuration
    const API_BASE = (() => {
        if (typeof window !== 'undefined' && window.API_BASE) return window.API_BASE;
        if (location.hostname === '127.0.0.1') {
            return 'http://localhost:5500';
        }
        return '';
    })();

    function getOrCreateSessionId() {
        const STORAGE_KEY = 'gscc_session_id';
        try {
            const existing = localStorage.getItem(STORAGE_KEY);
            if (existing) return existing;
            const random = (window.crypto && window.crypto.randomUUID)
                ? window.crypto.randomUUID()
                : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const sessionId = `web-${random}`;
            localStorage.setItem(STORAGE_KEY, sessionId);
            return sessionId;
        } catch (_) {
            return `web-fallback-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }
    }

    // State
    let currentLanguage = null;
    let isTyping = false;

    // Translations
    const translations = {
        english: {
            welcome: "Welcome to the Jharkhand Guruji Student Credit Card (GSCC) Assistant.\n\nI am an AI assistant trained on official government documentation to help students and parents understand the Student Credit Card scheme.\n\nI can help you with:\n• Eligibility criteria for the credit card\n• Maximum loan limits and interest rates\n• List of approved banks and institutions\n• Mandatory document requirements\n• Application process and tracking\n• Repayment terms and moratorium periods\n\nPlease ask any questions regarding the GSCC Jharkhand scheme.",
            changeLanguage: "Change Language",
            placeholder: "Ask about GSCC scheme...",
            typing: "Thinking...",
            status: "Online"
        },
        hindi: {
            welcome: "झारखंड गुरुजी छात्र क्रेडिट कार्ड (GSCC) सहायक में आपका स्वागत है।\n\nमैं छात्रों और माता-पिता को छात्र क्रेडिट कार्ड योजना को समझने में मदद करने के लिए आधिकारिक सरकारी दस्तावेज़ीकरण पर प्रशिक्षित एक AI सहायक हूं।\n\nमैं आपकी इनमें सहायता कर सकता हूं:\n• क्रेडिट कार्ड के लिए पात्रता मानदंड\n• अधिकतम ऋण सीमा और ब्याज दरें\n• अनुमोदित बैंकों और संस्थानों की सूची\n• अनिवार्य दस्तावेज़ आवश्यकताएं\n• आवेदन प्रक्रिया और ट्रैकिंग\n• पुनर्भुगतान शर्तें और स्थगन अवधि\n\nकृपया GSCC झारखंड योजना के बारे में कोई भी प्रश्न पूछें।",
            changeLanguage: "भाषा बदलें",
            placeholder: "GSCC योजना के बारे में पूछें...",
            typing: "सहायक टाइप कर रहा है...",
            status: "ऑनलाइन"
        }
    };

    // DOM Elements
    const chatFloatBtn = document.getElementById('chatFloatBtn');
    const chatWindow = document.getElementById('chatWindow');
    const chatCloseBtn = document.getElementById('chatCloseBtn');
    const languageSelection = document.getElementById('languageSelection');
    const chatMessages = document.getElementById('chatMessages');
    const chatInputArea = document.getElementById('chatInputArea');
    const messagesContainer = document.getElementById('messagesContainer');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const headerStatus = document.getElementById('headerStatus');
    const toggleBtnText = document.getElementById('toggleBtnText');
    const typingText = document.getElementById('typingText');    

    // Open/Close Chat
    chatFloatBtn.addEventListener('click', () => {
        chatWindow.classList.add('open');
        chatFloatBtn.classList.add('hidden');
    });

    chatCloseBtn.addEventListener('click', () => {
        chatWindow.classList.remove('open');
        chatFloatBtn.classList.remove('hidden');
    });

    // Language Selection
    function selectLanguage(lang) {
        currentLanguage = lang;
        // console.log(currentLanguage);
        languageSelection.classList.add('hidden');
        chatMessages.classList.add('active');
        chatInputArea.classList.add('active');

        // Update UI text
        headerStatus.textContent = translations[lang].status;
        toggleBtnText.textContent = translations[lang].changeLanguage;
        chatInput.placeholder = translations[lang].placeholder;
        typingText.textContent = translations[lang].typing;

        // Add welcome message
        addMessage('bot', translations[lang].welcome);
    }

    // Change Language
    function changeLanguage() {
        currentLanguage = null;
        languageSelection.classList.remove('hidden');
        chatMessages.classList.remove('active');
        chatInputArea.classList.remove('active');
        messagesContainer.innerHTML = '';
        headerStatus.textContent = 'Ready';
    }

    // Format response text
    function formatResponse(text) {
        text = text.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        text = text.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        let lines = text.split('\n');
        let inList = false;
        let formattedLines = [];

        for (let line of lines) {
            if (line.trim().match(/^• /)) {
                if (!inList) {
                    formattedLines.push('<ul>');
                    inList = true;
                }
                formattedLines.push('<li>' + line.trim().substring(2) + '</li>');
            } else {
                if (inList) {
                    formattedLines.push('</ul>');
                    inList = false;
                }
                if (line.trim()) {
                    formattedLines.push('<p>' + line + '</p>');
                }
            }
        }

        if (inList) formattedLines.push('</ul>');

        return formattedLines.join('\n').replace(/<p>\s*<\/p>/g, '');
    }

    // Add Message
    function addMessage(sender, content, isHtml = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;

        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'message-bubble';
        bubbleDiv.style.marginTop = '40px';

        if (isHtml) {
            bubbleDiv.innerHTML = content;
        } else {
            bubbleDiv.innerHTML = formatResponse(content);
        }

        messageDiv.appendChild(bubbleDiv);
        messagesContainer.appendChild(messageDiv);

        // Scroll to bottom
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Send Message with Streaming
    async function sendMessage() {
        const message = chatInput.value.trim();
        if (!message || isTyping) return;

        // Add user message
        addMessage('user', message);
        chatInput.value = '';
        updateSendButton();

        // Show typing indicator
        isTyping = true;
        typingIndicator.classList.add('active');

        // Create bot message container for streaming
        const botDiv = document.createElement('div');
        botDiv.className = 'message bot';
        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = 'message-bubble';
        botDiv.appendChild(bubbleDiv);
        messagesContainer.appendChild(botDiv);

        let fullResponse = '';

        try {
            console.log(currentLanguage);
            const sessionId = getOrCreateSessionId();
            const response = await fetch(`${API_BASE}/chat-stream`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-session-id': sessionId,
                },
                body: JSON.stringify({
                    question: message,
                    sessionId,
                    language: currentLanguage
                })
            });

            if (!response.ok) {
                let errorPayload = {};
                try {
                    errorPayload = await response.json();
                } catch (_) {}
                throw new Error(errorPayload.error || `Request failed with status ${response.status}`);
            }


            if (!response.body) {
                throw new Error('Streaming not supported in this browser');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const parts = buffer.split('\n\n');
                buffer = parts.pop() || '';

                for (const part of parts) {
                    if (!part.trim()) continue;
                    const lines = part.split('\n').filter(Boolean);
                    const eventLine = lines.find((line) => line.startsWith('event:'));
                    const dataLines = lines.filter((line) => line.startsWith('data:'));
                    if (!eventLine || dataLines.length === 0) continue;

                    const event = eventLine.replace('event:', '').trim();
                    let payload = null;
                    try {
                        payload = JSON.parse(
                            dataLines.map((line) => line.replace('data:', '').trim()).join('\n')
                        );
                    } catch (_) {
                        continue;
                    }

                    if (event === 'chunk') {
                        fullResponse += payload?.text || '';
                        bubbleDiv.innerHTML = formatResponse(fullResponse);
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    } else if (event === 'end') {
                        await reader.cancel().catch(() => {});
                        break;
                    } else if (event === 'error') {
                        await reader.cancel().catch(() => {});
                        throw new Error(payload?.error || 'Streaming error');
                    }
                }
            }
        } catch (error) {
            console.error('Error sending message:', error);
            bubbleDiv.innerHTML = formatResponse(
                currentLanguage === 'english'
                    ? `Sorry, I encountered an error: ${error.message}`
                    : `क्षमा करें, मुझे एक त्रुटि का सामना करना पड़ा: ${error.message}`
            );
        } finally {
            typingIndicator.classList.remove('active');
            isTyping = false;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }

    // Update Send Button State
    function updateSendButton() {
        if (chatInput.value.trim()) {
            sendBtn.classList.add('active');
        } else {
            sendBtn.classList.remove('active');
        }
    }

    // Input Event Listeners
    chatInput.addEventListener('input', updateSendButton);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
